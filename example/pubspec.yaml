name: remote_input_example
description: "Example app for the remote_input package: a host that injects, and a viewer that captures, on two machines."
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  remote_input:
    path: ../
  web_socket_channel: ^3.0.3

dev_dependencies:
  # The Windows injection test's own Win32 calls.
  ffi: ^2.2.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
